{% set name = "geoarrow-pyarrow" %}
{% set version = "0.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8d01902ba83015e7b7286c884c6ee2126d006fdfa8f70bd1c104bf924ef94aa1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=61.0.0
    - setuptools-scm
  run:
    - geoarrow-c >=0.3.0
    - geoarrow-types >=0.3.0
    - pyarrow
    - python >={{ python_min }}

test:
  imports:
    - geoarrow.pyarrow
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/geoarrow/geoarrow-python
  summary: GeoArrow integration with pyarrow and pyarrow-based libraries
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - paleolimbot
